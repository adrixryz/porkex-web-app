name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          # Vite+ requires ^22.18 || ^24.11 || >=26; 24 is the current LTS.
          version: '1.3.0'
          node-version: '24'
          cache: true
          run-install: true

      - run: vp check
      - run: vp run typecheck
      - run: vp test
      - run: vp run build
      - run: vp exec playwright install --with-deps chromium
      - run: vp run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: test-results/
